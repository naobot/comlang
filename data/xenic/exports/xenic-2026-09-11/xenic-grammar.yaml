# Exported from comlang on 2026-09-11.
#
# A partial grammar: it carries only what the app currently models. Absent by
# design rather than by omission — alignment, closed_class, exceptions and
# samples have no home in the app yet. Morpheme order lives under the morphology
# key below.

meta:
  name: xenic
  exported_at: 2026-09-11
  source: comlang

phonology:
  consonants: [p, b, t, d, m, ŋ, k, ɡ, ɾ, n, h, x, s, t͡s, j, l, q, w]
  vowels: [e, i, u, o, a]
  classes:
    C:
      members: [b, d, ɡ, h, j, k, l, m, n, ŋ, p, q, ɾ, s, t, t͡s, w, x]
    V:
      members: [a, e, i, o, u]
    A:
      members: [j, l, ɾ, w]
    non-codas:
      members: [a, b, d, e, ɡ, h, i, j, o, q, ɾ, t͡s, u, w, x]
    non-w approximants:
      members: [j, l, ɾ]
    liquids:
      members: [l, ɾ]
    h and x:
      members: [h, x]
    ts and ng:
      members: [ŋ, t͡s]
    front vowels:
      members: [a, e, i]

orthography:
  graphemes:
    a: a
    b: b
    d: d
    e: e
    ɡ: g
    q: gk
    h: h
    i: i
    j: i
    k: k
    x: kh
    l: l
    m: m
    n: n
    ŋ: ng
    o: o
    p: p
    ɾ: r
    s: s
    t: t
    t͡s: ts
    u: u
    w: w
  rules:
    /j/ and /w/ in the onset:
      effect: "/j/ is written <y> when it is the only onset of its syllable, or when the next segment is /i/; as the second member of an onset cluster, and not before /i/, it is written <i>.\n/w/ is written <w> when it is the only onset of its syllable, or when the next segment is /u/; as the second member of an onset cluster, and not before /u/, it is written <u>."
      examples: "/dusaju/ → dusayu \"motorcycle\" (j sole onset)\n/baphju/ → bappiu \"danger\" (j second member of an onset cluster, not before /i/)\n/kwawi/ → kuawi \"corridor\" (w sole onset)\n/bwi/ → bui \"road\" (w second member of an onset cluster, not before /u/)"
    /h/ after a consonant:
      effect: /h/ immediately after a consonant doubles that consonant in writing; the /h/ itself is dropped. Confirmed for both voiceless and voiced consonants (/p t s k l/ all attested).
      examples: "/dwekhal/ → duekkal \"last\" (k+h → kk)\n/kothwu/ → kottwu \"cellphone\" (t+h → tt)\n/beshi/ → bessi \"item\" (s+h → ss)\n/tumxelho/ → tumkhello \"managing\" (l+h → ll)"

morphology:
  slots:
    nominal: [numeral, classifier, STEM, plural, case, semanticParticle]
    predicate: [negation, STEM, tense, force, evidential, conjunction]
  stems:
    - { slot_class: nominal, word_class: [noun, pronoun, quantifier, demonstrative, interrogative, numeral] }
    - { slot_class: predicate, word_class: [verb, adjective, predicate] }
    - { slot_class: both, word_class: [modal, adverb, particle, conjunction, negation] }
  affixes:
    - { role: negation, position: prefix, entry_key_prefix: p_neg }
    - { role: negation, position: prefix, word_class: [negation] }
    - { role: case, position: suffix, entry_key: [p_top, p_nom, p_acc, p_dat, p_gen, p_loc, p_ins] }
    - { role: case, position: suffix, word_class: [case marker] }
    - { role: semanticParticle, position: suffix, entry_key: [p_also, p_only, p_with] }
    - { role: semanticParticle, position: suffix, word_class: [semantic particle] }
    - { role: conjunction, position: suffix, entry_key: [p_conj, p_disj, p_cause, p_cond, p_temp] }
    - { role: conjunction, position: suffix, word_class: [conjunction] }
    - { role: tense, position: suffix, entry_key_prefix: t_ }
    - { role: tense, position: suffix, word_class: [tense marker] }
    - { role: force, position: suffix, entry_key_prefix: f_ }
    - { role: force, position: suffix, word_class: [force marker] }
    - { role: evidential, position: suffix, entry_key_prefix: e_ }
    - { role: evidential, position: suffix, word_class: [evidential] }
    - { role: classifier, position: prefix, entry_key: [q_class] }
    - { role: classifier, position: prefix, word_class: [classifier] }
  rules:
    vowels: aeiou
    glides: jw
    digraphs: [ng, ts]
    reduplication: enabled
    gemination: disabled
    harmony: disabled
    elision: disabled
    lowering: disabled

phonotactics:
  syllable_templates:
    - name: maximal
      notation: (C)(A)V(C′)
      weight: 1
      slots:
        - { class: C, role: nucleus, optional: true }
        - { class: A, role: onset, optional: true }
        - { class: V, role: nucleus, optional: false }
        - { class: C, role: coda, optional: true, phonemes: [p, t, k, m, n, ŋ, l, s] }
  constraints:
    - non-codas cannot be a coda
    - A followed by A not allowed
    - V followed by V not allowed
    - h and x followed by liquids not allowed
    - /q/ followed by A not allowed
    - /q/ followed by front vowels not allowed
    - ts and ng followed by non-w approximants not allowed

word_classes:
  adjective:
    kind: open
  noun:
    kind: open
    inflects_for: [case, number]
  predicate:
    kind: open
    inflects_for: [evidential, force, tense]
  verb:
    kind: open
    inflects_for: [evidential, force, tense]
  case marker:
    kind: closed
    description: Occupies the case slot on a nominal.
    inflects_for: [case]
  semantic particle:
    kind: closed
    description: Occupies the case slot instead of a case marker.
    inflects_for: [semantic_particle]
  tense marker:
    kind: closed
    inflects_for: [tense]
  force marker:
    kind: closed
    inflects_for: [force]
  evidential:
    kind: closed
    description: A final coda rather than a full morpheme.
    inflects_for: [evidential]
  relativizer:
    kind: closed
    description: All three do modifier duty; a modifier is a relativized predicate.
    inflects_for: [tense]
  pronoun:
    kind: closed
    inflects_for: [number, person]
  demonstrative:
    kind: closed
    inflects_for: [deixis]
  particle:
    kind: closed
  numeral:
    kind: closed
  classifier:
    kind: closed
    description: One general classifier; the system is deferred upstream.
  negation:
    kind: closed
    description: A prefix on the predicate word, with three allomorphs.
  adverb:
    kind: open
    description: Manner, time and sequence modifiers (key prefix adv_).
  quantifier:
    kind: closed
    description: any / each / every / none / some (key prefix d_).
  modal:
    kind: closed
    description: Ability, desire, necessity, obligation, permission, potential, recommendation (key prefix g_).
  conjunction:
    kind: closed
    description: "Coordinators and subordinators: and, or, but, because, if, when (key prefix p_)."
  interrogative:
    kind: closed
    description: "Question words: who, what, which, when, where, why, how (key prefix qu_)."

categories:
  person:
    values: [first, second, third]
  number:
    values: [singular, plural, paucal]
    # paucal: reduplication without numeral+counter
  case:
    values: [topic, nominative, accusative, dative, genitive, locative, instrumental]
  semantic_particle:
    values: [only, with, too]
    description: Occupies the case slot instead of a case marker; with the case cue gone the DP is expected in prototypical word order.
  tense:
    values: [past, present, future]
  force:
    values: [declarative, interrogative, imperative]
    # declarative: no form; see meta.missing upstream
  evidential:
    values: [direct, indirect, unmarked]
  deixis:
    values: [proximal, medial, distal]

